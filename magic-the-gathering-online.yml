# Magic: The Gathering Online — Lutris install script for Fedora Atomic
# (Aurora, Bazzite, Silverblue/Kinoite, and any distro where Lutris is only
# available as a Flatpak).
#
# This script only uses features Lutris manages itself (its own Wine/GE-Proton
# runner builds, its own winetricks, its own per-game pre-launch hook). It
# never looks for host binaries like umu-run or a Steam install, because
# those paths are unreliable — or simply absent — inside the Flatpak sandbox.
#
# What it does:
#   1. Creates a 64-bit Wine prefix.
#   2. Installs corefonts and .NET Framework 4.8 (MTGO requires classic
#      .NET Framework, not .NET Core) via winetricks.
#   3. Disables the Wine audio driver. MTGO reliably crashes the instant it
#      tries to play a sound effect under Wine (EULA accept chime, match
#      start, etc.) — this is a well-known Wine/MTGO issue, not a bug in
#      this script. Disabling sound avoids it entirely.
#   4. Runs the MTGO setup.exe you provide (see README) to install the
#      client into the prefix.
#   5. Writes a small tuning script into the game folder that re-applies a
#      handful of MTGO.exe.config flags which stop its WPF UI from pegging
#      a CPU core (and freezing) while scrolling a large collection. MTGO's
#      own auto-updater resets this file, so the tuning script is wired up
#      as a Lutris "pre-launch" hook and reruns automatically every time you
#      hit Play — no manual steps after the first install.
#
# Usage: in Lutris, "+" -> "Install script" -> point it at this file.
# See README.md in this repository for the full step-by-step instructions,
# including the one-time Wine/GE-Proton runner setup Aurora needs first.
#
# NOTE ON FORMAT: Lutris's "Install script" file picker expects the same
# shape its own lutris.net API returns — top-level metadata plus the actual
# installer body nested under a "script:" key. That's why everything below
# is nested that way instead of flat.

name: Magic The Gathering Online
game_slug: magic-the-gathering-online
version: Fedora Atomic / Flatpak Lutris
slug: magic-the-gathering-online-atomic
runner: wine

script:
  # Downloads setup.exe directly from MTGO's own patch server (operated by
  # Daybreak Games) instead of making you fetch it by hand first. If this
  # URL ever starts failing (patch-server paths do occasionally change),
  # replace this line with:
  #   - setup: "N/A:Select the MTGO setup.exe you downloaded from https://www.mtgo.com/en/mtgo/download"
  # which prompts you to point at a manually-downloaded copy instead.
  files:
  - setup: "https://mtgo.patch.daybreakgames.com/patch/mtg/live/client/setup.exe"

  game:
    exe: $GAMEDIR/setup.exe
    prefix: $GAMEDIR
    arch: win64

  # No "wine:" version block on purpose. Lutris 0.5.22 already defaults a new
  # Wine game to the latest GE-Proton (run through umu), which is exactly what
  # MTGO needs — so the old manual "Configure -> Runner options -> Wine version"
  # step is no longer required. (Pinning it explicitly here does NOT work:
  # Lutris's installer rewrites "ge-proton" to "ge-proton-x86_64" and then
  # fails to resolve that as a downloadable runner.)

  system:
    env:
      # Critical fix: disable GE-Proton 11's new in-kernel ntsync. With ntsync
      # active, MTGO's WPF startup crashes during window teardown — several
      # windows (EULA, main) appear, then MTGO.exe dies while the rest of the
      # Wine process tree keeps running (Lutris still shows "Stop"). The failure
      # is an unhandled Win32Exception from HwndWrapper.DestroyWindow inside
      # Dispatcher.ShutdownImpl() — a thread-wakeup / synchronization failure
      # that only happens under ntsync. Forcing the fsync fallback
      # (PROTON_NO_NTSYNC=1) makes MTGO reach a stable, connected login screen.
      # Confirmed against GE-Proton 11-4/11-6 on Bazzite; same fix used by the
      # phever/mtgo-linux project.
      PROTON_NO_NTSYNC: '1'
      # Critical fix: hard-disable Wine's audio driver via DLL override.
      # MTGO's AudioManager plays a startup chime; under Wine that path also
      # queries the audio session (ISimpleAudioVolume). With winepulse loaded,
      # that QueryInterface returns E_NOINTERFACE and MTGO dies with an
      # unhandled InvalidCastException before the login window is usable. With
      # NO audio driver at all, the same code hits a *handled* NAudio
      # "BadDeviceId" and MTGO carries on to the login screen.
      # The `sound=disabled` winetricks verb below is supposed to do this, but
      # its registry write does not reliably survive a GE-Proton 11-6 prefix
      # (winepulse gets re-registered at launch). This env override can't be
      # lost that way, so it's the real fix; the winetricks verb stays as a
      # belt-and-braces second layer. Proton appends its own overrides after
      # this value, and it sets nothing for these DLLs, so the disable sticks.
      WINEDLLOVERRIDES: winepulse.drv=;winealsa.drv=;wineoss.drv=;winecoreaudio.drv=
    prelaunch_command: bash $GAMEDIR/mtgo-tune.sh
    prelaunch_wait: true

  installer:
  - task:
      name: create_prefix
      prefix: $GAMEDIR
      arch: win64

  - task:
      name: winetricks
      prefix: $GAMEDIR
      app: corefonts dotnet48

  # Disable the Wine audio driver. MTGO plays a chime at startup and crashes
  # under Wine when it does. This is the "belt" layer; the real fix is the
  # WINEDLLOVERRIDES audio disable in `system: env:` above, because this
  # registry write does not reliably survive a GE-Proton 11-6 prefix. The
  # client is fully usable without sound.
  - task:
      name: winetricks
      prefix: $GAMEDIR
      app: sound=disabled

  # Critical fix: MTGO's WPF UI can start (you'll see the splash and loading
  # screens) and then never show its main window at all, even though the
  # process is still running. This is WPF's hardware-accelerated (D3D)
  # renderer failing to composite under Wine. Forcing GDI rendering avoids
  # it. Sourced from the pauleve/docker-mtgo project's own Wine setup.
  - task:
      name: winetricks
      prefix: $GAMEDIR
      app: renderer=gdi

  # Run the ClickOnce bootstrapper to download + deploy the client. It shows an
  # "Application Install - Security Warning" dialog first — click Install (it may
  # render as a blank window; the button is still there, bottom-right / Alt+I).
  # exclude_processes: once setup.exe has finished the download it hands off to
  # MTGO.exe (which then sits on the login screen) plus GE-Proton's dfsvc.exe /
  # xalia.exe / umu.exe helpers. None of those ever exit on their own, so
  # without listing them here Lutris waits forever on this step and the install
  # never completes. setup.exe itself is NOT excluded, so Lutris still waits for
  # the ~640 MB download to finish.
  - task:
      name: wineexec
      prefix: $GAMEDIR
      executable: setup
      exclude_processes: dfsvc.exe MTGO.exe xalia.exe umu.exe

  # wineexec above runs setup.exe wherever you selected it from (e.g.
  # ~/Downloads) — it does NOT copy it into $GAMEDIR. Without this step,
  # $GAMEDIR/setup.exe (what "game.exe" below points the Play button at)
  # would never exist.
  - copy:
      src: setup
      dst: $GAMEDIR

  # Re-applied on every launch via prelaunch_command above, because MTGO's
  # updater overwrites MTGO.exe.config and reverts these flags. Only touches
  # the game's own prefix folder — no host paths, no runner detection.
  - write_file:
      file: $GAMEDIR/mtgo-tune.sh
      content: |
        #!/usr/bin/env bash
        # Re-applies the WPF flags that stop MTGO's collection view from
        # pinning a CPU core / freezing the UI. Safe to run any number of
        # times; silently does nothing if the config file isn't there yet.
        set -uo pipefail
        GAMEDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        find "$GAMEDIR" -path '*Apps/2.0*' -iname 'MTGO.exe.config' -exec sed -i -E \
          's/("(DisableAutomationPeer|PurgeAutomationEvents|DisableStylusInput|DisableTabletDevices)" value=")false/\1true/g' \
          {} + 2>/dev/null
        exit 0

  - execute:
      command: chmod +x $GAMEDIR/mtgo-tune.sh

  - execute:
      command: bash $GAMEDIR/mtgo-tune.sh
