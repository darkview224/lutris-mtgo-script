# Magic: The Gathering Online — Lutris install script.
#
# This script only uses features Lutris manages itself (its own Wine/GE-Proton
# runner builds, its own winetricks, its own per-game pre-launch hook). It never
# looks for host binaries like umu-run or a Steam install.
#
# What it does:
#   1. Creates a 64-bit Wine prefix.
#   2. Installs corefonts and .NET Framework 4.8 (MTGO needs classic .NET
#      Framework, not .NET Core) via winetricks.
#   3. Disables the Wine audio driver (winetricks sound=disabled + a runner-level
#      DLL override — see the notes on each below). MTGO crashes under Wine when
#      it plays its startup chime.
#   4. Forces WPF onto Wine's GDI renderer (winetricks renderer=gdi) so MTGO's
#      windows actually paint.
#   5. Copies setup.exe into the game folder and writes a small tuning script
#      that re-applies a few MTGO.exe.config flags (stops the WPF collection view
#      from pegging a CPU core). It's wired up as a Lutris pre-launch hook so it
#      reruns automatically on every Play.
#
# The MTGO client itself (~640 MB) is NOT downloaded during install — the first
# time you click Play, setup.exe runs its ClickOnce bootstrapper, which shows an
# "Application Install - Security Warning" dialog (click Install), downloads and
# deploys the client, and opens the login screen. Every later Play launches MTGO
# directly. (Deploying during install instead makes Lutris hang: the client sits
# on the login screen and the wine/umu process tree never exits, so the install
# step never returns.)
#
# Usage: in Lutris, "+" -> "Install script" -> point it at this file.
# See README.md for the full step-by-step instructions.
#
# NOTE ON FORMAT: Lutris's "Install script" file picker expects the same shape
# its own lutris.net API returns — top-level metadata plus the installer body
# nested under a "script:" key.

name: Magic The Gathering Online
game_slug: magic-the-gathering-online
version: '2026-08'
slug: magic-the-gathering-online-2026-08
runner: wine

script:
  # Downloads setup.exe directly from MTGO's own patch server (operated by
  # Daybreak Games) instead of making you fetch it by hand first. If this URL
  # ever starts failing (patch-server paths do occasionally change), replace
  # this line with:
  #   - setup: "N/A:Select the MTGO setup.exe you downloaded from https://www.mtgo.com/en/mtgo/download"
  # which prompts you to point at a manually-downloaded copy instead.
  files:
  - setup: "https://mtgo.patch.daybreakgames.com/patch/mtg/live/client/setup.exe"

  game:
    exe: $GAMEDIR/setup.exe
    prefix: $GAMEDIR
    arch: win64

  # No "wine: version:" block on purpose. Lutris 0.5.22 already defaults a new
  # Wine game to the latest GE-Proton (run through umu), which is what MTGO
  # needs — so the old manual "Configure -> Runner options -> Wine version" step
  # is no longer required. (Pinning it explicitly here does NOT work: Lutris's
  # installer rewrites "ge-proton" to "ge-proton-x86_64" and then fails to
  # resolve that as a downloadable runner.)
  wine:
    # Critical fix: hard-disable Wine's audio drivers. MTGO's AudioManager plays
    # a chime at startup; under Wine that path also queries the audio session
    # (ISimpleAudioVolume). With winepulse loaded, that QueryInterface returns
    # E_NOINTERFACE and MTGO dies with an unhandled InvalidCastException before
    # the login screen is usable. With NO audio driver at all, the same code
    # hits a *handled* NAudio "BadDeviceId" and MTGO carries on to login.
    # This has to be a runner-level DLL override, not `system: env:
    # WINEDLLOVERRIDES` — Lutris rebuilds WINEDLLOVERRIDES from this list at
    # launch and would overwrite anything set via the environment. The
    # `sound=disabled` winetricks verb below is a second layer; on its own its
    # registry write does not reliably survive a GE-Proton 11-6 prefix.
    overrides:
      winepulse.drv: disabled
      winealsa.drv: disabled
      wineoss.drv: disabled
      winecoreaudio.drv: disabled

  system:
    env:
      # Critical fix: disable GE-Proton 11's in-kernel ntsync. With ntsync
      # active, MTGO's WPF startup crashes during window teardown — several
      # windows (EULA, main) appear, then MTGO.exe dies while the rest of the
      # Wine process tree keeps running (Lutris still shows "Stop"). The failure
      # is an unhandled Win32Exception from HwndWrapper.DestroyWindow inside
      # Dispatcher.ShutdownImpl() — a thread-wakeup / synchronization failure
      # that only happens under ntsync. Forcing the fsync fallback makes MTGO
      # reach a stable, connected login screen. Confirmed against GE-Proton
      # 11-4/11-6 on Bazzite; same fix used by the phever/mtgo-linux project.
      PROTON_NO_NTSYNC: '1'
    prelaunch_command: bash $GAMEDIR/mtgo-tune.sh
    prelaunch_wait: true

  installer:
  - task:
      name: create_prefix
      prefix: $GAMEDIR
      arch: win64

  - task:
      name: winetricks
      prefix: $GAMEDIR
      app: corefonts dotnet48

  # Second layer of the audio-disable (see wine.overrides above for the primary
  # fix and the full explanation). Harmless if it doesn't stick.
  - task:
      name: winetricks
      prefix: $GAMEDIR
      app: sound=disabled

  # Critical fix: MTGO's WPF UI can start (you'll see the splash and loading
  # screens) and then never show its main window at all, even though the process
  # is still running. This is WPF's hardware-accelerated (D3D) renderer failing
  # to composite under Wine. Forcing GDI rendering avoids it. Sourced from the
  # pauleve/docker-mtgo project's own Wine setup.
  - task:
      name: winetricks
      prefix: $GAMEDIR
      app: renderer=gdi

  # game.exe (the Play button) points at $GAMEDIR/setup.exe. The downloaded
  # setup.exe lives in Lutris's cache, not $GAMEDIR, so copy it in. The client
  # itself is deployed by the first Play, not here (see the header comment).
  - copy:
      src: setup
      dst: $GAMEDIR

  # Re-applied on every launch via prelaunch_command above, because MTGO's
  # updater overwrites MTGO.exe.config and reverts these flags. Only touches the
  # game's own prefix folder — no host paths, no runner detection. It's a no-op
  # until the client has been deployed (first Play), which is fine.
  - write_file:
      file: $GAMEDIR/mtgo-tune.sh
      content: |
        #!/usr/bin/env bash
        # Re-applies the WPF flags that stop MTGO's collection view from
        # pinning a CPU core / freezing the UI. Safe to run any number of
        # times; silently does nothing if the config file isn't there yet.
        set -uo pipefail
        GAMEDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        find "$GAMEDIR" -path '*Apps/2.0*' -iname 'MTGO.exe.config' -exec sed -i -E \
          's/("(DisableAutomationPeer|PurgeAutomationEvents|DisableStylusInput|DisableTabletDevices)" value=")false/\1true/g' \
          {} + 2>/dev/null
        exit 0

  - execute:
      command: chmod +x $GAMEDIR/mtgo-tune.sh
